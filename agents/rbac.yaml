apiVersion: v1
kind: ServiceAccount
metadata:
  name: claude-worker
  namespace: claude-workers
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: claude-worker
  namespace: claude-workers
rules:
  - apiGroups: [""]
    resources: ["pods"]
    verbs: ["get", "list", "patch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: claude-worker
  namespace: claude-workers
subjects:
  - kind: ServiceAccount
    name: claude-worker
    namespace: claude-workers
roleRef:
  kind: Role
  name: claude-worker
  apiGroup: rbac.authorization.k8s.io
