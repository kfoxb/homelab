---
# ConfigMap holds the scheduler script so we can mount it into the kubectl image
# without building a custom container image.
apiVersion: v1
kind: ConfigMap
metadata:
  name: scheduler-entrypoint
  namespace: claude-workers
data:
  entrypoint.sh: |
    #!/usr/bin/env bash
    set -euo pipefail

    NAMESPACE="claude-workers"
    CONFIG_DIR="/etc/worker-config"

    while true; do
      sleep 30

      # Read max concurrency from mounted ConfigMap volume
      MAX=$(cat "${CONFIG_DIR}/maxConcurrent" 2>/dev/null || echo "2")

      # Count pods currently in running state
      RUNNING=$(kubectl get pods -n "${NAMESPACE}" -l status=running \
        --no-headers 2>/dev/null | wc -l | tr -d '[:space:]')

      echo "[$(date -u +%Y-%m-%dT%H:%M:%SZ)] running=${RUNNING} max=${MAX}"

      if [ "${RUNNING}" -lt "${MAX}" ]; then
        # Find the oldest queued pod (sorted by creationTimestamp ascending)
        OLDEST=$(kubectl get pods -n "${NAMESPACE}" -l status=queued \
          --sort-by=.metadata.creationTimestamp \
          -o custom-columns='NAME:.metadata.name' \
          --no-headers 2>/dev/null | head -1)

        if [ -n "${OLDEST}" ]; then
          kubectl label pod "${OLDEST}" -n "${NAMESPACE}" status=running --overwrite
          echo "[$(date -u +%Y-%m-%dT%H:%M:%SZ)] Released: ${OLDEST}"
        fi
      fi
    done
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: queue-scheduler
  namespace: claude-workers
spec:
  replicas: 1
  selector:
    matchLabels:
      app: queue-scheduler
  template:
    metadata:
      labels:
        app: queue-scheduler
    spec:
      serviceAccountName: claude-worker
      containers:
        - name: scheduler
          image: bitnami/kubectl:latest
          command: ["bash", "/scripts/entrypoint.sh"]
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              cpu: 100m
              memory: 128Mi
          volumeMounts:
            - name: entrypoint
              mountPath: /scripts
            - name: worker-config
              mountPath: /etc/worker-config
      volumes:
        - name: entrypoint
          configMap:
            name: scheduler-entrypoint
            defaultMode: 0755
        - name: worker-config
          configMap:
            name: worker-config
