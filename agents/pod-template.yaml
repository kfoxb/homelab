apiVersion: v1
kind: Pod
metadata:
  name: ${TASK_NAME}
  namespace: claude-workers
  labels:
    app: claude-worker
    task: ${TASK_NAME}
    repo: ${REPO_SLUG}
    branch: ${GIT_BRANCH_LABEL}
    ticket: ${LINEAR_TICKET}
    status: running
spec:
  serviceAccountName: claude-worker
  restartPolicy: Never

  containers:
    - name: claude-worker
      image: ${CLAUDE_IMAGE}
      envFrom:
        - secretRef:
            name: claude-worker-secrets
      env:
        - name: TASK_NAME
          value: "${TASK_NAME}"
        - name: REPO_URL
          value: "${REPO_URL}"
        - name: REPO_SLUG
          value: "${REPO_SLUG}"
        - name: GIT_BRANCH
          value: "${GIT_BRANCH}"
        - name: LINEAR_TICKET
          value: "${LINEAR_TICKET}"
        # Prompt is mounted as a file via ConfigMap (created by ccw start)
        - name: CLAUDE_PROMPT_FILE
          value: "/prompt/prompt.txt"
      resources:
        requests:
          cpu: 500m
          memory: 1Gi
        limits:
          cpu: 2000m
          memory: 4Gi
      volumeMounts:
        - name: workspace
          mountPath: /workspace
        - name: prompt
          mountPath: /prompt
          readOnly: true

  volumes:
    - name: workspace
      emptyDir: {}
    - name: prompt
      configMap:
        name: ${TASK_NAME}-prompt
